onboarding = false

[theme]
# Use the outer terminal's ANSI palette so Omarchy theme changes flow through
# in the same way as the tmux colour names.
name = "terminal"

[terminal]
new_cwd = "follow"

[keys]
# Match the tmux prefix. Herdr does not currently support tmux's secondary
# ctrl+b prefix.
prefix = "ctrl+space"

# General
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+q"
workspace_picker = "prefix+s"
goto = "prefix+w"

# Tmux sessions map to Herdr workspaces.
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Tmux windows map to Herdr tabs.
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
switch_tab = ["prefix+1..9", "alt+1..9"]

# Panes
copy_mode = "prefix+["
rename_pane = "prefix+alt+p"
focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"
split_vertical = ["prefix+v", "alt+shift+enter"]
split_horizontal = ["prefix+h", "alt+enter"]
close_pane = ["prefix+x", "alt+esc"]
resize_mode = "prefix+shift+z"

# Herdr has no tab-reorder binding, so tmux's alt+shift+left/right window
# swaps remain unassigned.

[[keys.command]]
key = "ctrl+alt+shift+left"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction left --amount 0.05'
description = "resize pane left"

[[keys.command]]
key = "ctrl+alt+shift+down"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction down --amount 0.05'
description = "resize pane down"

[[keys.command]]
key = "ctrl+alt+shift+up"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction up --amount 0.05'
description = "resize pane up"

[[keys.command]]
key = "ctrl+alt+shift+right"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction right --amount 0.05'
description = "resize pane right"
